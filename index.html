<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow — Minhas Tarefas</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;background:#f7faff;color:#10203b;overflow:hidden}.app{height:100vh;display:flex}.side{width:224px;flex:0 0 224px;background:linear-gradient(#081a41,#061536);color:#c5d2e9;display:flex;flex-direction:column}.brand{height:145px;text-align:center;padding:5px 29px;border-bottom:1px solid #17305b}.brand div{height:63px;background:#fff;border-radius:10px;display:grid;place-items:center;overflow:hidden}.brand img{max-width:100%;max-height:60px}.brand b{display:block;color:#eef4ff;font-size:18px;margin-top:10px}.nav{display:grid;gap:5px;padding:10px 12px}.nav a{height:38px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:13px;cursor:pointer}.nav a.active,.nav a:hover{color:#fff;background:#1a3770}.profile{margin-top:auto;padding:15px;border-top:1px solid #1c3159;font-size:12px}.top{height:39px;border-bottom:1px solid #d7e1ee;text-align:right;padding:8px 20px}.view{height:67px;padding:14px 25px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #d7e1ee;background:#fbfdff;color:#53627b;font-weight:600}.tabs{padding:3px;border:1px solid #d9e3ef;background:#eff3f8;border-radius:11px}.tab{border:0;border-radius:8px;background:transparent;padding:8px 12px;color:#526176;cursor:pointer;font:14px inherit}.tab.active{background:#fff;color:#14233e;box-shadow:0 1px 2px #bdc7d6}.actions{height:54px;padding:8px 25px;display:flex;justify-content:flex-end;gap:8px;border-bottom:1px solid #d7e1ee;background:#fbfdff}.btn{height:36px;border:1px solid #d7e1ee;background:#fff;border-radius:10px;padding:0 14px;color:#16243c;cursor:pointer;font:14px inherit;box-shadow:0 1px 2px #d9e1ea}.primary{background:#142e68;color:white;border-color:#142e68;font-weight:700}.filters{height:63px;padding:8px 12px;display:flex;gap:7px;align-items:center;border-bottom:1px solid #d7e1ee;background:#fbfdff;overflow:auto}.filter{height:31px;min-width:120px;border:1px solid #d7e1ee;background:#fff;border-radius:9px;padding:0 10px;color:#263952}.wide{min-width:182px}.board{padding:15px 16px;overflow:auto;flex:1}.cols{display:flex;gap:16px;min-width:max-content}.col{width:286px}.head{height:38px;display:flex;gap:7px;align-items:center;padding:0 8px;font-size:16px;font-weight:750}.dot{height:12px;width:12px;border-radius:50%}.count{font-size:12px;background:#e5ebf2;border-radius:99px;padding:2px 8px}.plus{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer}.drop{min-height:180px;padding:9px;border-left:4px solid var(--c);background:#eff4fa;border-radius:10px;display:flex;flex-direction:column;gap:9px}.empty{margin:auto;color:#94a4b9;font-size:12px}.card{background:#fff;border:1px solid #d7e1ec;border-radius:9px;padding:10px;box-shadow:0 1px 3px #bdc8d833;cursor:grab}.tag{font-size:10px;font-weight:bold;background:#173c84;color:#fff;padding:4px 7px;border-radius:4px}.card h4{margin:10px 0 7px;line-height:1.35}.card p{margin:0;color:#596982;line-height:1.4}.foot{border-top:1px solid #e7edf4;margin-top:9px;padding-top:8px;color:#63738b;font-size:11px}.panel{display:none;overflow:auto;flex:1;padding:22px 25px}.panel.show{display:block}.emptybox{height:350px;border:1px solid #dbe5f0;border-radius:11px;background:#fff;display:grid;place-items:center;text-align:center;color:#687891}.listhead{display:grid;grid-template-columns:42px 1fr 150px 160px 135px 120px;background:#edf3f9;border:1px solid #dbe5f0;padding:12px;font-size:12px;font-weight:bold;color:#55657e}.calhead{display:flex;gap:8px;align-items:center;margin-bottom:14px}.calhead h2{text-transform:capitalize;font-size:16px}.grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));background:#fff;border:1px solid #dbe5f0;border-radius:10px;overflow:hidden}.week,.day{border-right:1px solid #dbe5f0;padding:9px}.week{font-size:11px;text-align:center;background:#f1f5fa;font-weight:bold;color:#65748b}.day{height:110px;border-top:1px solid #dbe5f0;font-size:12px;color:#586981}.event{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:#dce9fb;color:#17418a;border-radius:4px;margin-top:5px;padding:3px 5px;font-size:10px;cursor:pointer}.back{display:none;position:fixed;inset:0;background:#07132988;align-items:center;justify-content:center}.back.show{display:flex}.modal{width:min(760px,calc(100vw - 28px));background:#f9fbff;border-radius:14px;padding:24px;box-shadow:0 22px 60px #0005}.close{float:right;border:0;background:none;font-size:22px;cursor:pointer}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-weight:bold;font-size:13px}.field input,.field select,.field textarea{border:1px solid #d6e1ed;border-radius:9px;background:#fff;padding:10px;font:14px inherit}.field textarea{height:100px}.formactions{text-align:right;margin-top:20px}.formactions button{margin-left:8px}@media(max-width:800px){.side{width:64px;flex-basis:64px}.brand{padding:16px 10px;height:105px}.brand div{height:35px}.brand b,.nav span,.profile{display:none}.nav{padding:10px}.nav a{justify-content:center;padding:0}.view,.actions{padding-left:14px}.filters{flex-wrap:nowrap}.form{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div><img src="taskflow-logo.png" alt="Business Mentoring"></div><b>TaskFlow</b></div><nav class="nav"><a>⊞ <span>Dashboard</span></a><a class="active">☷ <span>Minhas Tarefas</span></a><a>⇧ <span>Importar Ata</span></a><a>♙ <span>Clientes</span></a><a>▥ <span>Relatórios</span></a><a>▤ <span>Mural</span></a><a>⊟ <span>Portal do Cliente</span></a><a>♧ <span>Usuários</span></a><a>♲ <span>Lixeira</span></a><a>⚙ <span>Personalizar</span></a></nav><div class="profile">● Usuário demonstração<br><small>acesso local</small></div></aside><main style="min-width:0;flex:1;display:flex;flex-direction:column"><div class="top">♧</div><div class="view"><span>Visualizar como:</span><div class="tabs"><button class="tab active" data-v="kanban">▣ &nbsp;Kanban</button><button class="tab" data-v="lista">☷ &nbsp;Lista</button><button class="tab" data-v="cal">▦ &nbsp;Calendário</button></div></div><div class="actions"><button class="btn">▱ &nbsp;Arquivos Cliente</button><button class="btn">Etiquetas</button><button class="btn">＋ &nbsp;Coluna</button><button class="btn primary" id="new">＋ &nbsp;Tarefa</button></div><div class="filters"><div class="tabs"><button class="tab active">♧ Todas</button><button class="tab">Atribuídas a mim</button><button class="tab">Criadas por mim</button></div><select class="filter"><option>Todas</option><option>Vence hoje</option><option>Em atraso</option></select><select class="filter"><option>Clientes</option></select><select class="filter wide"><option>Todos responsáveis</option></select><select class="filter"><option>Todas prioridades</option></select><select class="filter"><option>Todos status</option></select></div><section class="board" id="kanban"><div class="cols" id="cols"></div></section><section class="panel" id="lista"><div class="listhead"><span>☐</span><span>TAREFA</span><span>RESPONSÁVEL</span><span>CLIENTE</span><span>PRAZO</span><span>STATUS</span></div><div class="emptybox" id="listempty">Nenhuma tarefa encontrada</div><div id="rows"></div></section><section class="panel" id="cal"><div class="calhead"><button class="btn" id="prev">‹</button><button class="btn" id="next">›</button><button class="btn" id="today">Hoje</button><h2 id="month"></h2></div><div class="grid" id="grid"></div></section></main></div><div class="back" id="back"><form class="modal" id="form"><button type="button" class="close" id="close">×</button><h2>Nova tarefa</h2><div class="form"><div class="field full"><label>Título *</label><input id="title" required placeholder="O que precisa ser feito?"></div><div class="field"><label>Prioridade</label><select id="priority"><option>Média</option><option>Baixa</option><option>Alta</option><option>Urgente</option></select></div><div class="field"><label>Status</label><select id="status"></select></div><div class="field"><label>Cliente</label><select><option>Nenhum</option></select></div><div class="field"><label>Responsável</label><select><option>Usuário demonstração</option></select></div><div class="field"><label>Prazo</label><input id="due" type="date"></div><div class="field full"><label>Descrição</label><textarea id="desc" placeholder="Descreva a tarefa..."></textarea></div><div class="field full"><label>Subtarefas</label><input id="subs" placeholder="Uma subtarefa por linha (opcional)"></div></div><div class="formactions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar</button></div></form></div><script>
const cols=[['todo','A Fazer','#8193a9'],['doing','Em Andamento','#f2a000'],['waiting','Aguardando Retorno','#dce600'],['review','Em Revisão','#50a7de'],['follow','Acompanhamento','#c994ce'],['done','Concluídas','#54c58a']],$=s=>document.querySelector(s);let tasks=[],drag,month=new Date;function render(){let root=$('#cols');root.innerHTML=cols.map(c=>{let x=tasks.filter(t=>t.col==c[0]);return `<div class="col"><div class="head">⠿ <i class="dot" style="background:${c[2]}"></i>${c[1]} <b class="count">${x.length}</b><button class="plus" data-add="${c[0]}">＋</button>⋮</div><div class="drop" style="--c:${c[2]}" data-drop="${c[0]}">${x.length?x.map(card).join(''):'<span class="empty">Nenhuma tarefa nesta etapa</span>'}</div></div>`}).join('');document.querySelectorAll('.card').forEach(e=>{e.draggable=true;e.ondragstart=()=>drag=e.dataset.id;e.ondblclick=()=>edit(e.dataset.id)});document.querySelectorAll('.drop').forEach(e=>{e.ondragover=x=>x.preventDefault();e.ondrop=x=>{let t=tasks.find(q=>q.id==drag);t.col=e.dataset.drop;render()}});document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>open(e.dataset.add));list();calendar()}function card(t){return `<article class="card" data-id="${t.id}"><span class="tag">${t.priority.toUpperCase()}</span><h4>${t.title}</h4>${t.desc?'<p>'+t.desc+'</p>':''}${t.subs.length?'<p>☷ Subtarefas: '+t.subs.length+'</p>':''}<div class="foot">◷ ${t.due?new Date(t.due+'T12:00').toLocaleDateString('pt-BR'):'Sem prazo'} &nbsp; ◉ US</div></article>`}function open(col='todo'){window.editing=null;$('#title').value=$('#desc').value=$('#due').value=$('#subs').value='';$('#priority').value='Média';$('#status').innerHTML=cols.map(c=>`<option value="${c[0]}" ${c[0]==col?'selected':''}>${c[1]}</option>`).join('');$('#back').classList.add('show');$('#title').focus()}function edit(id){let t=tasks.find(x=>x.id==id);window.editing=id;$('#title').value=t.title;$('#desc').value=t.desc;$('#due').value=t.due;$('#subs').value=t.subs.join('\n');$('#priority').value=t.priority;$('#status').innerHTML=cols.map(c=>`<option value="${c[0]}" ${c[0]==t.col?'selected':''}>${c[1]}</option>`).join('');$('#back').classList.add('show')}function list(){let r=$('#rows');r.innerHTML=tasks.map(t=>`<div class="listhead" style="font-weight:400;background:#fff;border-top:0"><span>☐</span><span>${t.title}</span><span>Usuário demonstração</span><span>Nenhum</span><span>${t.due||'Sem prazo'}</span><span>${cols.find(c=>c[0]==t.col)[1]}</span></div>`).join('');$('#listempty').style.display=tasks.length?'none':'grid'}function calendar(){let ds=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'],y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,last=new Date(y,m+1,0).getDate();$('#month').textContent=month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});$('#grid').innerHTML=ds.map(x=>'<div class="week">'+x+'</div>').join('')+Array(offset).fill('<div class="day"></div>').join('')+Array.from({length:last},(_,i)=>{let d=i+1,key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return '<div class="day"><b>'+d+'</b>'+tasks.filter(t=>t.due==key).map(t=>'<button class="event">'+t.title+'</button>').join('')+'</div>'}).join('')}$('#new').onclick=()=>open();$('#close').onclick=$('#cancel').onclick=()=>$('#back').classList.remove('show');$('#form').onsubmit=e=>{e.preventDefault();let t={id:window.editing||Date.now(),title:$('#title').value,desc:$('#desc').value,due:$('#due').value,priority:$('#priority').value,col:$('#status').value,subs:$('#subs').value.split('\n').filter(Boolean)};tasks=window.editing?tasks.map(x=>x.id==t.id?t:x):[...tasks,t];$('#back').classList.remove('show');render()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['kanban','lista','cal'].forEach(x=>$('#'+x).classList.toggle('show',x==b.dataset.v));$('#kanban').classList.toggle('hidden',b.dataset.v!='kanban')});$('#prev').onclick=()=>{month.setMonth(month.getMonth()-1);calendar()};$('#next').onclick=()=>{month.setMonth(month.getMonth()+1);calendar()};$('#today').onclick=()=>{month=new Date;calendar()};render();
</script></body></html>
